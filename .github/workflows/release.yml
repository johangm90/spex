name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          # macOS Intel
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz

          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz

          # Linux ARM64 (Graviton, Raspberry Pi 4+)
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            use_cross: true

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

          # Windows ARM64
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.use_cross != true
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }}

      - name: Package (tar.gz — Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BINARY="spex"
          TARGET="${{ matrix.target }}"
          ARCHIVE_NAME="${BINARY}-${VERSION}-${TARGET}"

          mkdir -p "dist/${ARCHIVE_NAME}"
          cp "target/${TARGET}/release/${BINARY}" "dist/${ARCHIVE_NAME}/"
          cp README.md LICENSE dist/${ARCHIVE_NAME}/ 2>/dev/null || true

          cd dist
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}/"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          echo "ARCHIVE=${ARCHIVE_NAME}.tar.gz" >> $GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE_NAME}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package (zip — Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME
          $BINARY  = "spex"
          $TARGET  = "${{ matrix.target }}"
          $ARCHIVE_NAME = "${BINARY}-${VERSION}-${TARGET}"

          New-Item -ItemType Directory -Force -Path "dist/${ARCHIVE_NAME}" | Out-Null
          Copy-Item "target/${TARGET}/release/${BINARY}.exe" "dist/${ARCHIVE_NAME}/"
          foreach ($f in @("README.md","LICENSE")) {
            if (Test-Path $f) { Copy-Item $f "dist/${ARCHIVE_NAME}/" }
          }

          Push-Location dist
          Compress-Archive -Path "${ARCHIVE_NAME}" -DestinationPath "${ARCHIVE_NAME}.zip"
          $hash = (Get-FileHash "${ARCHIVE_NAME}.zip" -Algorithm SHA256).Hash.ToLower()
          "${hash}  ${ARCHIVE_NAME}.zip" | Out-File -Encoding ascii "${ARCHIVE_NAME}.zip.sha256"
          Pop-Location

          echo "ARCHIVE=${ARCHIVE_NAME}.zip" >> $env:GITHUB_ENV
          echo "CHECKSUM=${ARCHIVE_NAME}.zip.sha256" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cat > release_notes.md << EOF
          ## spex ${VERSION}

          ### Install

          **macOS / Linux — one-liner:**
          \`\`\`sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/${VERSION}/install.sh | sh
          \`\`\`

          **Or download directly:**

          | Platform | Architecture | Download |
          |----------|-------------|---------|
          | macOS | Apple Silicon (M1/M2/M3) | [spex-${VERSION}-aarch64-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-aarch64-apple-darwin.tar.gz) |
          | macOS | Intel | [spex-${VERSION}-x86_64-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-x86_64-apple-darwin.tar.gz) |
          | Linux | x86_64 | [spex-${VERSION}-x86_64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-x86_64-unknown-linux-gnu.tar.gz) |
          | Linux | ARM64 | [spex-${VERSION}-aarch64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-aarch64-unknown-linux-gnu.tar.gz) |
          | Windows | x86_64 | [spex-${VERSION}-x86_64-pc-windows-msvc.zip](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-x86_64-pc-windows-msvc.zip) |
          | Windows | ARM64 | [spex-${VERSION}-aarch64-pc-windows-msvc.zip](https://github.com/${{ github.repository }}/releases/download/${VERSION}/spex-${VERSION}-aarch64-pc-windows-msvc.zip) |

          ### Verify checksums
          \`\`\`sh
          sha256sum -c spex-${VERSION}-<target>.tar.gz.sha256
          \`\`\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            install.sh
            install.ps1
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
