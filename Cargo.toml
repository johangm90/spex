[package]
name = "spex"
version = "0.6.0"
edition = "2021"
description = "Spec-driven development CLI for AI agent coordination"
repository = "https://github.com/johangm90/spex"
license = "MIT"
keywords = ["ai", "agents", "mcp", "cli", "sdd"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "spex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "cargo", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
colored = "2"
dirs = "5"
include_dir = { version = "0.7", features = ["glob"] }
inquire = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
