[package]
name = "spex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spex"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color", "cargo", "env"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
colored = "2"
dirs = "5"
include_dir = { version = "0.7", features = ["glob"] }
minijinja = { version = "2", features = ["loader"] }
inquire = "0.7"
indicatif = "0.17"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
